<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Clash</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none; /* Prevent scrolling on mobile */
      font-family: monospace;
    }
    
    #gameContainer {
      position: relative;
      /* Maximize while keeping 9:16 aspect ratio */
      height: 100vh;
      max-height: 100vh;
      aspect-ratio: 9/16;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      background-color: #000;
    }
    
    @media (min-aspect-ratio: 9/16) {
      #gameContainer {
        height: 100vh;
        width: auto;
      }
    }
    
    @media (max-aspect-ratio: 9/16) {
      #gameContainer {
        width: 100vw;
        height: auto;
      }
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated; /* Sharp pixels */
      image-rendering: crisp-edges;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="loading">Loading Engine...</div>
    <canvas id="gameCanvas" width="180" height="320"></canvas>
  </div>
  <script src="game.js"></script>
</body>
</html>
