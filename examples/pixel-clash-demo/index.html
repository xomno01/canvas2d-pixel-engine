<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đại Chiến Tiệm Net</title>
  <!-- Sử dụng font pixel tương tự game gốc -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0; background-color: #111;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; touch-action: none;
      font-family: 'Press Start 2P', monospace;
    }
    #gameContainer {
      position: relative; width: 100vw; height: 100vh;
      max-width: 600px; /* Limit on desktop */
      background: #000;
    }
    canvas {
      display: block; width: 100%; height: 100%;
      image-rendering: pixelated;
    }
    /* Giao diện UI chuẩn Tiệm Net Cỏ */
    #ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.7);
      z-index: 10;
    }
    .modal {
      background: #191c2b; border: 2px solid #5a7596; border-radius: 12px;
      padding: 20px; text-align: center; width: 80%; max-width: 320px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.8);
    }
    .modal-header {
      color: #7d96b8; font-size: 10px; margin-bottom: 15px; text-transform: uppercase;
      letter-spacing: 1px;
    }
    .modal-title {
      color: #ff5e5e; font-size: 24px; text-shadow: 2px 2px 0 #8b0000;
      margin-bottom: 25px; line-height: 1.4;
    }
    .btn {
      display: block; width: 100%; padding: 12px 0; margin-bottom: 15px;
      font-family: 'Press Start 2P', monospace; font-size: 10px;
      border-radius: 6px; cursor: pointer; text-transform: uppercase;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-blue {
      background: #1e88e5; border: 2px solid #0d47a1; color: white;
      text-shadow: 1px 1px 0 #000;
    }
    .btn-yellow {
      background: #ffca28; border: 2px solid #ff8f00; color: #3e2723;
    }
    #game-ui {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 22%;
      background: #191c2b; border-top: 2px solid #5a7596;
      display: none; flex-direction: column;
    }
    #cards {
      display: flex; justify-content: space-around; align-items: center;
      flex: 1; padding: 5px;
    }
    .card {
      width: 22%; aspect-ratio: 3/4; background: #2a354a; border: 2px solid #5a7596;
      border-radius: 6px; position: relative; box-shadow: 0 4px 0 #111520;
    }
    .card.disabled { filter: grayscale(1) brightness(0.5); }
    .card-cost {
      position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
      background: #9c27b0; color: white; padding: 2px 4px; border-radius: 4px;
      font-size: 8px; border: 1px solid #4a148c;
    }
    .card-img {
      width: 100%; height: 100%; image-rendering: pixelated;
    }
    #elixir-bar-container {
      height: 15px; background: #000; margin: 0 10px 10px 10px; border-radius: 8px;
      border: 2px solid #333; position: relative;
    }
    #elixir-fill {
      height: 100%; background: #9c27b0; width: 50%; border-radius: 6px;
      transition: width 0.1s linear; border-top: 2px solid #e1bee7;
    }
    #elixir-text {
      position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
      color: white; font-size: 8px; text-shadow: 1px 1px 0 #000;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <!-- UI Chờ Menu (Mô phỏng Net Cỏ) -->
    <div id="ui-overlay">
      <div class="modal">
        <div class="modal-header">🟢 TÀI KHOẢN ONLINE</div>
        <div class="modal-title">ĐẠI CHIẾN<br><span style="color:#ffca28">TIỆM NÉT</span></div>
        <p style="font-size:8px; color:white; line-height:1.5; margin-bottom:20px;">
          Bảo vệ quán Net của bạn khỏi sự cạnh tranh của quán đối thủ!
        </p>
        <button class="btn btn-blue" onclick="startGame()">ĐĂNG NHẬP GOOGLE</button>
        <button class="btn btn-yellow" onclick="startGame()">CHƠI NHANH TÀI KHOẢN KHÁCH</button>
      </div>
    </div>
    
    <!-- UI Game (Sẽ hiện khi bấm chơi) -->
    <div id="game-ui">
      <div id="cards">
        <div class="card" id="card-0"><img class="card-img" id="img-0"><div class="card-cost" id="cost-0">3</div></div>
        <div class="card" id="card-1"><img class="card-img" id="img-1"><div class="card-cost" id="cost-1">2</div></div>
        <div class="card" id="card-2"><img class="card-img" id="img-2"><div class="card-cost" id="cost-2">4</div></div>
        <div class="card" id="card-3"><img class="card-img" id="img-3"><div class="card-cost" id="cost-3">5</div></div>
      </div>
      <div id="elixir-bar-container">
        <div id="elixir-fill"></div>
        <div id="elixir-text">5.0</div>
      </div>
    </div>

    <!-- Canvas -->
    <canvas id="game"></canvas>
  </div>
  <script src="game.js"></script>
</body>
</html>
